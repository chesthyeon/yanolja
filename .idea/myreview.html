<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 후기</title>
</head>
<body>
<header>
  <h1>내 후기</h1>
</header>
<main>
  <section>
    <h2>작성한 후기</h2>
    <ul class="review-list">
      <li class="review-item">
        <h3>숙소 이름</h3>
        <p>아주 깨끗하고 편안한 숙소였습니다. 직원들도 친절했습니다!</p>
        <div class="actions">
          <span class="status">상태: 승인됨</span>
          <div>
            <button>수정</button>
            <button style="background: #f44336;">삭제</button>
          </div>
        </div>
      </li>
      <li class="review-item">
        <h3>레저 활동 이름</h3>
        <p>가이드가 친절했고, 정말 즐거운 경험이었습니다!</p>
        <div class="actions">
          <span class="status">상태: 승인 대기</span>
          <div>
            <button>수정</button>
            <button style="background: #f44336;">삭제</button>
          </div>
        </div>
      </li>
    </ul>
  </section>
</main>
</body>
</html>
