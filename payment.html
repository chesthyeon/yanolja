<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>결제 페이지</title>
</head>
<body>
	<h1>결제 페이지</h1>
	<p>결제 정보</p>
	<table>
		<tr>
			<td>상품명</td>
			<td>무슨무슨 방</td>
		</tr>
		<tr>
			<td>기간</td>
			<td>2021.01.01 ~ 2021.01.02</td>
		</tr>
		<tr>
			<td>결제 수단</td>
			<td>신용카드</td>
		</tr>
		<tr>
			<td>결제 금액</td>
			<td>100,000원</td>
		</tr>
		<tr>
			<td>결제자</td>
			<td>홍길동</td>
		</tr>
		<tr>
			<td>연락처</td>
			<td>010-1234-5678</td>
		</tr>
		<tr>
			<td>이메일</td>
			<td>
				<input type="text" name="email" value="test@admin.com">
			</td>
		</tr>
		<tr>
			<td>결제하기</td>
			<td>
				<button type="submit">결제하기</button>
			</td>
		</tr>
	</table>
</body>
</html>
