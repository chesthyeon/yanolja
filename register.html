<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
</head>
<body>
<h1>회원가입</h1>

<form id="signupForm" onsubmit="return validateForm(event)">
  <div>
    <label for="email">아이디(이메일):</label>
    <input type="email" id="email" name="email" required>
    <div id="emailError" style="display: none; color: red;">유효한 이메일을 입력해주세요.</div>
  </div>

  <div>
    <label for="name">이름:</label>
    <input type="text" id="name" name="name" required>
    <div id="nameError" style="display: none; color: red;">이름을 입력해주세요.</div>
  </div>

  <div>
    <label for="phone">전화번호:</label>
    <input type="tel" id="phone" name="phone" required>
    <div id="phoneError" style="display: none; color: red;">전화번호를 입력해주세요.</div>
  </div>

  <div>
    <label for="password">비밀번호:</label>
    <input type="password" id="password" name="password" required>
    <div id="passwordError" style="display: none; color: red;">비밀번호를 입력해주세요.</div>
  </div>

  <div>
    <label for="confirmPassword">비밀번호 확인:</label>
    <input type="password" id="confirmPassword" name="confirmPassword" required>
    <div id="confirmPasswordError" style="display: none; color: red;">비밀번호가 일치하지 않습니다.</div>
  </div>

  <button type="submit">회원가입</button>
</form>

<script>
  function validateForm(event) {
    event.preventDefault();

    const email = document.getElementById('email').value;
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // 필수 입력값 확인
    if (!email) {
      return false;
    }

    if (!name) {
      return false;
    }

    if (!phone) {
      return false;
    }

    if (!password) {
      return false;
    }

    // 비밀번호 확인 검사
    if (password !== confirmPassword) {
      return false;
    }

    // 모든 검증을 통과하면 메인 페이지로 이동
    window.location.href = 'index.html';
    return false;
  }
</script>
</body>
</html>
