<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>예약페이지</title>
</head>
<body>
	<h1>예약페이지</h1>
	<p>예약페이지입니다.</p>
	<table>
		<tr>
			<td>예약자명</td>
			<td><input type="text" name="name"></td>
		</tr>
		<tr>
			<td>예약일시</td>
			<td><input type="datetime-local" name="date"></td>
		</tr>
		<tr>
			<td>인원수</td>
			<td><input type="number" name="number"></td>
		</tr>
		<tr>
			<td>방</td>
			<td>
				<select>
					<option value="1">1번방</option>
					<option value="2">2번방</option>
					<option value="3">3번방</option>
					<option value="4">4번방</option>
				</select>
			</td>
		</tr>
		<tr>
			<td>방번호</td>
			<td><input type="number" name="room"></td>
		</tr>
		<tr>
			<td>예약</td>
			<td><input type="submit" value="예약하기"></td>
		</tr>
	</table>
</body>
</html>
